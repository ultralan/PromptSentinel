[project]
name = "prompt-sentinel"
version = "0.1.0"
description = "PromptSentinel：提示注入旁路检测器的 LoRA 与全量微调工程"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.2.0",
    "datasets>=3.2.0",
    "huggingface-hub>=0.27.0",
    "matplotlib>=3.11.1",
    "numpy>=2.0.0",
    "peft>=0.14.0",
    "pyyaml>=6.0.2",
    "safetensors>=0.4.5",
    "sentencepiece>=0.2.0",
    "torch>=2.13.0",
    "transformers>=4.47.0,<5.0.0",
]

[tool.uv]
package = false
